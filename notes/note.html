<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פתק</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="solo">
  <main id="solo" class="solo-note">
    <div class="solo-head">
      <div class="solo-palette" id="palette"></div>
      <button id="open-board" class="tool" title="פתח את הלוח המלא">⌂</button>
    </div>
    <input id="title" class="note-title" type="text" dir="rtl" maxlength="80" placeholder="כותרת" aria-label="כותרת הפתק">
    <textarea id="text" class="note-text" dir="rtl" spellcheck="false" placeholder="כתבו כאן…"></textarea>
    <div class="solo-status" id="status"></div>
  </main>
<script src="store.js"></script>
<script src="note.js"></script>
</body>
</html>
